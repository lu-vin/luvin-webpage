# CI/CD del sitio de Luvin, con los workflows compartidos de lu-vin/.github:
# - Pull requests a main: Conventional Commits, compila y revisa tipos (npm run verify).
# - Push a main: lo mismo y, si todo pasa, publica en Cloudflare Workers (https://lu-vin.com).
# luvin-architecture: deployment-architecture/0004.
#
# Secretos necesarios en GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con la plantilla "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
# Los secretos del formulario (SMTP_USER, SMTP_PASS...) viven en Cloudflare, no aquí:
# Workers & Pages → luvin-web → Settings → Variables and Secrets. Publicar no los borra.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En PRs, un push nuevo cancela la ejecución anterior. En main nunca se corta un despliegue a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: lu-vin/.github/.github/workflows/commits.yml@main

  site:
    uses: lu-vin/.github/.github/workflows/site.yml@main
    with:
      url: https://lu-vin.com
    secrets: inherit
